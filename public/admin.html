<!DOCTYPE html>
<html>
<head>
    <title>Admin</title>
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>

<h2>Laporan Warga</h2>

<div id="reports"></div>

<script>
fetch('/report/all')
.then(res => res.json())
.then(data => {
    const container = document.getElementById("reports");

    data.forEach(r => {
        container.innerHTML += `
            <div class="card">
                <p>${r.description}</p>
                <img src="uploads/${r.image}" width="200">
            </div>
        `;
    });
});
</script>

</body>
</html>
