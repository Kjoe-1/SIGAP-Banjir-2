<!DOCTYPE html>
<html>
<head>
    <title>Laporan Warga - Admin</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .laporan-container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }
        .laporan-card {
            background: white;
            border-radius: 10px;
            padding: 15px;
            width: 300px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            color: #333;
        }
        .laporan-card img {
            width: 100%;
            height: 150px;
            object-fit: cover; /* Biar foto rapi tidak gepeng */
            border-radius: 5px;
            margin: 10px 0;
            background: #eee;
        }
        .delete-btn {
            background: #ff4d4d;
            color: white;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 5px;
            width: 100%;
        }
        .delete-btn:hover { background: #cc0000; }
    </style>
</head>
<body>

<div class="container">
    <div class="navbar">
        <h2 style="color: white; padding: 20px;">Laporan Warga (Admin)</h2>
    </div>

    <div class="laporan-container" id="laporanList">
        </div>
</div>

<button class="back-floating" onclick="goDashboard()" style="position: fixed; bottom: 20px; left: 20px;">
    ⬅ Dashboard
</button>

<script>
function loadLaporan() {
    const container = document.getElementById("laporanList");
    let data = JSON.parse(localStorage.getItem("laporan")) || [];

    container.innerHTML = "";

    if (data.length === 0) {
        container.innerHTML = "<p style='color: white;'>Tidak ada laporan warga saat ini.</p>";
        return;
    }

    // Tampilkan dari yang terbaru (reverse)
    data.slice().reverse().forEach((item, i) => {
        const realIndex = data.length - 1 - i;
        const card = document.createElement("div");
        card.className = "laporan-card";

        card.innerHTML = `
            <p><b>Waktu:</b> ${item.waktu || "-"}</p>
            <p><b>Kategori:</b> ${item.kategori || "-"}</p>
            <p><b>Judul:</b> ${item.judul || "-"}</p>
            <p>${item.deskripsi || "-"}</p>

            ${item.foto ? `<img src="${item.foto}" alt="Foto Laporan">` : `<div style="height:150px; background:#ccc; text-align:center; line-height:150px;">Tanpa Foto</div>`}

            <button class="delete-btn" onclick="hapusLaporan(${realIndex})">
                Hapus
            </button>
        `;
        container.appendChild(card);
    });
}

function hapusLaporan(index) {
    let data = JSON.parse(localStorage.getItem("laporan")) || [];
    if (!confirm("Yakin ingin menghapus laporan ini secara permanen?")) return;

    data.splice(index, 1);
    localStorage.setItem("laporan", JSON.stringify(data));
    loadLaporan();
}

function goDashboard() {
    window.location.href = "dashboard.html";
}

document.addEventListener("DOMContentLoaded", loadLaporan);
</script>

</body>
</html>
