<!DOCTYPE html>
<html>
<head>
    <title>Upload Laporan</title>
    <link rel="stylesheet" href="css/dashboard.css">

    <style>
        body {
            background: #1e1e1e;
            color: white;
        }

        .upload-box {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 15px;
            max-width: 900px;
            margin: auto;
        }

        h2 {
            margin-bottom: 20px;
        }

        .row {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        select, input, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: #3a3a3a;
            color: white;
        }

        textarea {
            height: 100px;
            resize: none;
        }

        .drop-area {
            border: 2px dashed #888;
            padding: 40px;
            text-align: center;
            border-radius: 10px;
            margin: 15px 0;
            cursor: pointer;
        }

        .drop-area:hover {
            border-color: #0f6b6b;
        }

        .btn-main {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 20px;
            background: #1c8c8c;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-back {
            margin-top: 15px;
            padding: 10px 20px;
            border-radius: 20px;
            background: transparent;
            border: 1px solid white;
            color: white;
            cursor: pointer;
        }

        .file-name {
            font-size: 12px;
            margin-top: 10px;
            color: #ccc;
        }
    </style>
</head>

<body>

<div class="container">
    <div class="upload-box">

        <h2>Upload Laporan</h2>

        <form id="uploadForm">

            <div class="row">
                <select>
                    <option>Pilih Kategori...</option>
                    <option>Banjir</option>
                </select>

                <input type="text" placeholder="Judul Laporan">
            </div>

            <textarea placeholder="Tuliskan deskripsi lengkap di sini..."></textarea>

            <!-- DROP AREA -->
            <div class="drop-area" id="dropArea">
                <p>📤 Pilih File atau Drag & Drop</p>
                <input type="file" id="fileInput" hidden>
                <div class="file-name" id="fileName">Belum ada file</div>
            </div>

            <button class="btn-main" type="submit">Unggah Laporan Sekarang</button>

        </form>

        <button class="btn-back" onclick="goBack()">⬅ Kembali ke Dashboard</button>

    </div>
</div>

<script>
const dropArea = document.getElementById("dropArea");
const fileInput = document.getElementById("fileInput");
const fileName = document.getElementById("fileName");

// klik area = buka file
dropArea.onclick = () => fileInput.click();

// tampilkan nama file
fileInput.addEventListener("change", () => {
    fileName.innerText = fileInput.files[0]?.name || "Belum ada file";
});

// drag & drop
dropArea.addEventListener("dragover", (e) => {
    e.preventDefault();
    dropArea.style.borderColor = "#1c8c8c";
});

dropArea.addEventListener("dragleave", () => {
    dropArea.style.borderColor = "#888";
});

dropArea.addEventListener("drop", (e) => {
    e.preventDefault();
    fileInput.files = e.dataTransfer.files;
    fileName.innerText = fileInput.files[0]?.name || "Belum ada file";
    dropArea.style.borderColor = "#888";
});

// submit (dummy)
document.getElementById("uploadForm").addEventListener("submit", (e) => {
    e.preventDefault();
    alert("Laporan berhasil diupload!");
});

// back
function goBack() {
    window.location.href = "/dashboard.html";
}
</script>

</body>
</html>
